name: Validación de escritorio

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  base:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Preparar entorno gráfico Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64
      - name: Verificar ventana Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Verificar ventana Windows
        if: runner.os == 'Windows'
        run: npm run test:desktop
